name: safedrop

x-app: &app
  build:
    context: .
  env_file:
    - path: .env
      required: false
  environment: &app-env
    DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgres://safedrop:safedrop@postgres:5432/safedrop?sslmode=disable}
    STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
    STORAGE_LOCAL_ROOT: /data
    STORAGE_ENDPOINT: ${COMPOSE_STORAGE_ENDPOINT:-http://storage:9000}
    STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
    STORAGE_BUCKET: ${STORAGE_BUCKET:-safedrop}
    STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-change-me}
    STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-change-me}
    STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
    CLAMD_ADDRESS: clamd:3310
    MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
    RATE_LIMIT_REQUESTS_PER_SECOND: ${RATE_LIMIT_REQUESTS_PER_SECOND:-5}
    RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-10}
    METRICS_ADDR: ${METRICS_ADDR:-:9090}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  volumes:
    - uploads:/data
  depends_on:
    postgres:
      condition: service_healthy
    clamd:
      condition: service_healthy
    storage:
      condition: service_healthy
      required: false
  restart: unless-stopped

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: safedrop
      POSTGRES_PASSWORD: safedrop
      POSTGRES_DB: safedrop
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  clamd:
    image: clamav/clamav:stable
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: [CMD, clamdcheck.sh]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    restart: unless-stopped

  # Swappable S3 image; command and healthcheck below follow MinIO's contract.
  # Enable with STORAGE_BACKEND=s3 docker compose --profile s3 up --build.
  # Create the private STORAGE_BUCKET before uploading in S3 mode.
  storage:
    image: ${S3_IMAGE:-minio/minio:latest}
    profiles: [s3]
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-change-me}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-change-me}
    volumes:
      - s3-data:/data
    healthcheck:
      test: [CMD-SHELL, 'mc alias set health http://127.0.0.1:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null && mc ready health']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    <<: *app
    command: [/usr/local/bin/api]
    ports:
      - '${API_PORT:-8080}:8080'
      - '127.0.0.1:${API_METRICS_PORT:-9090}:9090'
    environment:
      <<: *app-env
      HTTP_ADDR: :8080
      OTEL_SERVICE_NAME: ${API_OTEL_SERVICE_NAME:-safedrop-api}
    healthcheck:
      # The future API must expose this readiness endpoint.
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    <<: *app
    command: [/usr/local/bin/worker]
    ports:
      - '127.0.0.1:${WORKER_METRICS_PORT:-9091}:9090'
    cpus: '${WORKER_CPUS:-1.0}'
    mem_limit: ${WORKER_MEMORY:-512m}
    environment:
      <<: *app-env
      GOMEMLIMIT: ${WORKER_GO_MEMORY_LIMIT:-384MiB}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_JOB_TIMEOUT: ${WORKER_JOB_TIMEOUT:-1m}
      OTEL_SERVICE_NAME: ${WORKER_OTEL_SERVICE_NAME:-safedrop-worker}
    healthcheck:
      # Process liveness only until the worker exposes a readiness probe.
      test: [CMD-SHELL, 'kill -0 1']
      interval: 15s
      timeout: 3s
      retries: 3

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    profiles: [tracing]
    ports:
      - '127.0.0.1:16686:16686'
      - '127.0.0.1:4318:4318'

volumes:
  postgres-data:
  clamav-data:
  s3-data:
  uploads:
