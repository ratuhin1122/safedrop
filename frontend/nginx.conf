map $http_accept $share_navigation {
    default 0;
    "~*text/html" 1;
}

map $request_uri $safe_uri {
    default $uri;
    ~^/s/ /s/[redacted];
}
map $request_uri $robots {
    default "";
    ~^/s/ "noindex, nofollow";
}
log_format safedrop '$remote_addr $request_method $safe_uri $status $body_bytes_sent';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/access.log safedrop;

    # Resolve the API at request time so the static app can start independently.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag $robots always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /v1/ {
        proxy_pass $api$request_uri;
    }

    location /s/ {
        error_log /dev/null;
        if ($share_navigation) {
            rewrite ^ /index.html last;
        }
        access_log off;
        proxy_pass $api$request_uri;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        error_log /dev/null;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
